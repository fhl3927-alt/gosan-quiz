<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고산교회 성경퀴즈 - 스마트 부저</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #11141a; margin: 0; padding: 0; color: white; overflow-x: hidden; }
        
        .admin-nav { display: grid; grid-template-columns: repeat(3, 1fr); background: #2d3748; padding: 6px; gap: 6px; position: sticky; top: 0; z-index: 5000; }
        
        .nav-btn { padding: 12px 4px; font-size: 17px; font-weight: bold; border: 3px solid transparent; border-radius: 6px; cursor: pointer; color: #fff; text-align: center; transition: all 0.2s ease; }
        
        .nav-btn.speed-tab { background: #8e3a00; color: #e2e8f0; } 
        .nav-btn.speed-tab.active { background: #ff7e22; color: #ffffff; border-color: #ffffff; box-shadow: 0 0 12px rgba(255,126,34,0.8); }
        
        .nav-btn.all-tab { background: #0b4d40; color: #e2e8f0; } 
        .nav-btn.all-tab.active { background: #1abc9c; color: #ffffff; border-color: #ffffff; box-shadow: 0 0 12px rgba(26,188,156,0.8); }

        .view-section { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100vw; min-height: calc(100vh - 60px); position: relative; }
        #section-phone { background: #f7fafc; color: #2d3748; padding: 15px 15px 50px 15px; align-items: flex-start; }
        .phone-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; margin: 0 auto; padding-bottom: 60px; }
        
        .top-info { background: #fff3cd; border: 2px solid #ffeeba; border-radius: 12px; padding: 12px; text-align: center; font-size: 17px; font-weight: bold; color: #856404; line-height: 1.4; }
        .net-status { font-size: 13px; margin-top: 5px; padding: 4px; border-radius: 6px; background: rgba(0,0,0,0.05); }
        
        .p-select, .p-input { width: 100%; height: 60px; font-size: 22px; font-weight: bold; border: 3px solid #4a5568; border-radius: 12px; padding: 0 15px; text-align: center; background: white; }
        .p-textarea { height: 180px; text-align: left; resize: none; padding: 15px; font-size: 20px; }

        .king-buzzer { width: 100%; height: 140px; background: #e74c3c; color: white; font-size: 40px; font-weight: 900; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 12px 0 #c0392b; text-shadow: 2px 4px 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; transition: 0.1s; }
        .king-buzzer:active { transform: translateY(12px); box-shadow: 0 0 0 #c0392b; }
        .king-buzzer.disabled { background: #cbd5e1 !important; box-shadow: 0 6px 0 #94a3b8 !important; color: #64748b !important; cursor: not-allowed; transform: none !important; }

        .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 5px; }
        .grid-2x2 .king-buzzer { height: 110px; font-size: 44px; }
        
        .grid-1x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 5px; }
        .grid-1x2 .king-buzzer { height: 150px; font-size: 60px; }
        .btn-o { background: #3498db; box-shadow: 0 12px 0 #2980b9; }
        .btn-x { background: #e74c3c; box-shadow: 0 12px 0 #c0392b; }

        .submit-btn { background: #2ecc71; box-shadow: 0 12px 0 #27ae60; margin-top: 10px; height: 90px; font-size: 28px; }
        
        .quiz-branding-footer { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: 800; letter-spacing: 0.5px; text-align: center; pointer-events: none; opacity: 0.4; color: #4a5568; }
    </style>
</head>
<body>

    <div class="admin-nav">
        <button class="nav-btn speed-tab active" id="tab-phone1" onclick="changeMode('phone1')">개인 객관식</button>
        <button class="nav-btn speed-tab" id="tab-phone2" onclick="changeMode('phone2')">개인 OX</button>
        <button class="nav-btn speed-tab" id="tab-phone3" onclick="changeMode('phone3')">개인 주관식</button>
        
        <button class="nav-btn all-tab" id="tab-phone4" onclick="changeMode('phone4')">전체 객관식</button>
        <button class="nav-btn all-tab" id="tab-phone5" onclick="changeMode('phone5')">전체 OX</button>
        <button class="nav-btn all-tab" id="tab-phone6" onclick="changeMode('phone6')">전체 주관식</button>
    </div>

    <div id="section-phone" class="view-section">
        <div class="phone-container">
            <div id="user-input-fields" style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
                <div class="top-info">
                    나의 팀과 이름을 먼저 입력해 주세요.
                    <div id="net-status-text" class="net-status" style="color: #2980b9;">🔄 전광판 시스템 연결 확인 중...</div>
                </div>
                <div>
                    <label style="font-size:18px; font-weight:bold; display:block; margin-bottom:6px;">1. 나의 팀 고르기</label>
                    <select id="select-team" class="p-select">
                        <option value="spring">봄 🌿</option><option value="summer">여름 ☀️</option><option value="autumn">가을 🍁</option><option value="winter">겨울 ❄️</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:18px; font-weight:bold; display:block; margin-bottom:6px;">2. 이름 입력하기</label>
                    <input type="text" id="input-user-name" class="p-input" placeholder="이름을 입력하세요">
                </div>

                <div style="border-top: 2px dashed #cbd5e1; padding-top: 15px; margin-top: 5px;">
                    <label style="font-size:18px; font-weight:bold; display:block; margin-bottom:10px; color:#e74c3c;" id="control-title">3. 알맞은 정답을 누르세요</label>
                    
                    <div id="control-phone1" class="ans-control" style="display:block;">
                        <div class="grid-2x2">
                            <button class="king-buzzer buzzer-btn speed-btn" onclick="sendAnswer('BUZZ', '1번', false)">1</button>
                            <button class="king-buzzer buzzer-btn speed-btn" onclick="sendAnswer('BUZZ', '2번', false)">2</button>
                            <button class="king-buzzer buzzer-btn speed-btn" onclick="sendAnswer('BUZZ', '3번', false)">3</button>
                            <button class="king-buzzer buzzer-btn speed-btn" onclick="sendAnswer('BUZZ', '4번', false)">4</button>
                        </div>
                    </div>

                    <div id="control-phone2" class="ans-control" style="display:none;">
                        <div class="grid-1x2">
                            <button class="king-buzzer btn-o buzzer-btn speed-btn" onclick="sendAnswer('BUZZ', 'O', false)">O</button>
                            <button class="king-buzzer btn-x buzzer-btn speed-btn" onclick="sendAnswer('BUZZ', 'X', false)">X</button>
                        </div>
                    </div>

                    <div id="control-phone3" class="ans-control" style="display:none;">
                        <textarea id="input-subjective-speed" class="p-input p-textarea" placeholder="정답을 자유롭게 적어주세요"></textarea>
                        <button class="king-buzzer submit-btn buzzer-btn speed-btn" onclick="submitSubjective('BUZZ', 'input-subjective-speed', true)">정답 전송 🚀</button>
                    </div>

                    <div id="control-phone4" class="ans-control" style="display:none;">
                        <div class="grid-2x2">
                            <button class="king-buzzer buzzer-btn all-btn" onclick="sendAnswer('ALL_SUBMIT', '1번', false)">1</button>
                            <button class="king-buzzer buzzer-btn all-btn" onclick="sendAnswer('ALL_SUBMIT', '2번', false)">2</button>
                            <button class="king-buzzer buzzer-btn all-btn" onclick="sendAnswer('ALL_SUBMIT', '3번', false)">3</button>
                            <button class="king-buzzer buzzer-btn all-btn" onclick="sendAnswer('ALL_SUBMIT', '4번', false)">4</button>
                        </div>
                    </div>

                    <div id="control-phone5" class="ans-control" style="display:none;">
                        <div class="grid-1x2">
                            <button class="king-buzzer btn-o buzzer-btn all-btn" onclick="sendAnswer('ALL_SUBMIT', 'O', false)">O</button>
                            <button class="king-buzzer btn-x buzzer-btn all-btn" onclick="sendAnswer('ALL_SUBMIT', 'X', false)">X</button>
                        </div>
                    </div>

                    <div id="control-phone6" class="ans-control" style="display:none;">
                        <textarea id="input-subjective-all" class="p-input p-textarea" placeholder="우리팀 정답을 적어주세요"></textarea>
                        <button class="king-buzzer submit-btn buzzer-btn all-btn" onclick="submitSubjective('ALL_SUBMIT', 'input-subjective-all', true)">전체 정답 제출 🚀</button>
                    </div>
                </div>
            </div>

            <div id="lock-guide-text" style="text-align:center; color:#718096; font-size:15px; font-weight:bold; margin-top:5px;">※ 누군가 먼저 누르면 5초간 전광판이 잠깁니다.</div>
        </div>

        <div class="quiz-branding-footer">2026 고산교회 성경퀴즈</div>
    </div>

<script>
    const BROADCAST_ROOM_ID = 'church_bible_quiz_room_2026';
    const PEER_CONFIG = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] } };

    let peer = null;
    let hostConn = null; 
    let isSpeedLocked = false;
    let isAllSubmitted = false;
    let currentMode = 'phone1'; 

    function initNetwork() {
        peer = new Peer(PEER_CONFIG);
        peer.on('open', function() {
            connectToHost();
        });
    }

    function connectToHost() {
        if (!peer || peer.destroyed) return;
        const statusLog = document.getElementById('net-status-text');
        statusLog.innerText = "🔄 전광판 시스템에 무선 연결을 시도 중...";
        statusLog.style.color = "#2980b9";

        hostConn = peer.connect(BROADCAST_ROOM_ID, { reliable: true });

        hostConn.on('open', function() {
            statusLog.innerText = "🟢 전광판 연결 성공! 버튼을 누르면 즉시 전송됩니다.";
            statusLog.style.color = "#27ae60";
        });

        // ✨ [네트워크 리셋 분기 감지 로직 적용]
        hostConn.on('data', function(data) {
            if (data.type === 'RESET_COMMAND_MANUAL') {
                // 관리자 강제 수동 버튼 리셋: 비활성화 풀고 alert 창 실행
                clearSubmittedState();
                alert("전광판이 리셋되어 다음 문제를 풀 수 있습니다!");
            } 
            else if (data.type === 'RESET_COMMAND_AUTO') {
                // 4팀 제출 자동 리셋: 비활성화만 해제 (alert 미실행)
                clearSubmittedState();
            }
        });

        hostConn.on('close', function() {
            statusLog.innerText = "🔴 연결 해제됨. 자동 재연결 시스템 가동 중...";
            statusLog.style.color = "#c0392b";
            setTimeout(connectToHost, 1500);
        });
    }

    // ✨ 중복 제어를 묶은 정답 해제 공통 함수
    function clearSubmittedState() {
        isAllSubmitted = false;
        document.querySelectorAll('.all-btn').forEach(btn => btn.classList.remove('disabled'));
        document.getElementById('input-subjective-all').value = "";
    }

    function changeMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + mode).classList.add('active');
        
        document.querySelectorAll('.ans-control').forEach(el => el.style.display = 'none');
        document.getElementById('control-' + mode).style.display = 'block';
        
        const titleEl = document.getElementById('control-title');
        const guideText = document.getElementById('lock-guide-text');
        
        if(mode === 'phone1') { titleEl.innerText = "3. [개인전] 보기에서 알맞은 번호를 누르세요"; guideText.innerText = "※ 정답 선점 시 5초간 전광판이 잠깁니다."; }
        if(mode === 'phone2') { titleEl.innerText = "3. [개인전] 맞다(O) 틀리다(X)를 누르세요"; guideText.innerText = "※ 정답 선점 시 5초간 전광판이 잠깁니다."; }
        if(mode === 'phone3') { titleEl.innerText = "3. [개인전] 빈칸에 글을 적고 전송을 누르세요"; guideText.innerText = "※ 정답 선점 시 5초간 전광판이 잠깁니다."; }
        if(mode === 'phone4') { titleEl.innerText = "3. [전체전] 보기에서 우리 팀의 답을 누르세요"; guideText.innerText = "※ 전체 참여전은 모든 팀의 정답이 화면에 기록됩니다."; }
        if(mode === 'phone5') { titleEl.innerText = "3. [전체전] 맞다(O) 틀리다(X)를 누르세요"; guideText.innerText = "※ 전체 참여전은 모든 팀의 정답이 화면에 기록됩니다."; }
        if(mode === 'phone6') { titleEl.innerText = "3. [전체전] 빈칸에 우리 팀의 답을 제출하세요"; guideText.innerText = "※ 전체 참여전은 모든 팀의 정답이 화면에 기록됩니다."; }
    }

    function submitSubjective(modeType, inputId, isSub) {
        const answer = document.getElementById(inputId).value.trim();
        if(!answer) { alert("정답을 입력해주세요!"); return; }
        sendAnswer(modeType, answer, isSub);
    }

    function sendAnswer(modeType, answerText, isSub) {
        if (modeType === 'BUZZ' && isSpeedLocked) return;
        if (modeType === 'ALL_SUBMIT' && isAllSubmitted) return;

        if (!hostConn || !hostConn.open) {
            alert("전광판과의 무선 연결이 원활하지 않습니다.");
            return;
        }

        const team = document.getElementById('select-team').value;
        const name = document.getElementById('input-user-name').value.trim() || "무명";
        
        const teamDetails = {
            spring: { name: "봄", colorClass: "win-spring" },
            summer: { name: "여름", colorClass: "win-summer" },
            autumn: { name: "가을", colorClass: "win-autumn" },
            winter: { name: "겨울", colorClass: "win-winter" }
        };
        const target = teamDetails[team];

        const payload = {
            type: modeType,
            teamId: team,
            teamName: target.name,
            userName: name,
            colorClass: target.colorClass,
            answer: answerText,
            isSubjective: isSub 
        };

        hostConn.send(payload);

        if (modeType === 'BUZZ') {
            isSpeedLocked = true;
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.add('disabled'));
            setTimeout(() => {
                isSpeedLocked = false;
                document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('disabled'));
                document.getElementById('input-subjective-speed').value = "";
            }, 5000);
        } else {
            isAllSubmitted = true;
            document.querySelectorAll('.all-btn').forEach(btn => btn.classList.add('disabled'));
        }
    }

    window.onload = function() {
        initNetwork();
    }
</script>
</body>
</html>
